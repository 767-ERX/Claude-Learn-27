# Publie l'appli sur GitHub Pages à chaque push sur main.
# Prérequis (une fois) : Settings → Pages → Source : « GitHub Actions ».
name: Publier sur GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier le contenu
        run: node scripts/check-content.js
      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -r index.html styles.css sw.js manifest.webmanifest js content icons _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
